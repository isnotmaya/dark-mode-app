<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Feature</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Demo Dark Mode</h1>
    <p>Ini adalah aplikasi sederhana untuk pengujian fitur mode gelap.</p>
    <button id="theme-toggle">Ubah ke Dark Mode</button>
  </div>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      toggleBtn.textContent = isDark ? 'Ubah ke Light Mode' : 'Ubah ke Dark Mode';
    });
  </script>
</body>
</html>
